services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/io-growth:cached
    command: sleep infinity
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ced_prod
      POSTGRES_DB_TEST: ced_test
      AZURITE_HOST: azurite
      AZURITE_BLOB_PORT: "10000"
      AZURITE_QUEUE_PORT: "10001"
      AZURITE_TABLE_PORT: "10002"

  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    restart: unless-stopped
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 -l /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
  azurite-init:
    image: mcr.microsoft.com/azure-cli@sha256:e02c9723b6e2296e98f54eeb3630b95206aef06aa04251e097ce8390904ba396
    depends_on:
      - azurite
    environment:
      # Azurite's default well-known connection string
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    command: >
      bash -c "
      echo 'Waiting for Azurite to start...' &&
      sleep 3 &&
      az storage container create --name audit &&
      echo 'Container created successfully!'"

  redis:
    image: redis:7@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    restart: unless-stopped
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file /tmp/nodes.conf --cluster-node-timeout 5000
      --cluster-announce-hostname redis --cluster-announce-port 6379
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-2:
    image: redis:7@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    restart: unless-stopped
    command: >
      redis-server --port 6380 --cluster-enabled yes
      --cluster-config-file /tmp/nodes.conf --cluster-node-timeout 5000
      --cluster-announce-hostname redis-2 --cluster-announce-port 6380
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-3:
    image: redis:7@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    restart: unless-stopped
    command: >
      redis-server --port 6381 --cluster-enabled yes
      --cluster-config-file /tmp/nodes.conf --cluster-node-timeout 5000
      --cluster-announce-hostname redis-3 --cluster-announce-port 6381
    ports:
      - "6381:6381"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-setup:
    image: redis:7@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    command: >
      redis-cli --cluster create redis:6379 redis-2:6380 redis-3:6381
      --cluster-replicas 0 --cluster-yes

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:a8b93e25520e999d867ed3949e7de7f4ff3ddab23ca95fa6f90230de5dd9729b
    ports:
      - "8081:8081"
      - "1234:1234"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 1
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"

volumes:
  postgres-data:
  azurite-data:
