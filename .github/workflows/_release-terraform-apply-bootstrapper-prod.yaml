name: Release Bootstrapper Infrastructure - prod
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/prod/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@3448c24fd46deea4a4a8cc6a0902641c448d2fb3 # main
    name: Release Bootstrapper (prod)
    secrets: inherit
    with:
      environment: 'prod'
