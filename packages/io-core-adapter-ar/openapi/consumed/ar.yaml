      description: >-
        Perform delete operation of an onboarding request receiving onboarding
        id, then invokes async process to set DELETED as status for institution
        and user onboardings.
      operationId: deleteOnboarding
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema:
            type: string
