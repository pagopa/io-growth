name: Check App FE - Prettier & ESLint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "apps/ced-app-fe/**"
      - ".github/workflows/check_app_fe.yaml"

permissions:
  contents: read

jobs:
  typescript_check:
    runs-on: ubuntu-latest
    name: TypeScript Check

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.4
        with:
          node-version: "22.22.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm --filter ced-app-fe tsc
        continue-on-error: false
  prettier_and_eslint:
    runs-on: ubuntu-latest
    name: Prettier & ESLint Check

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.4
        with:
          node-version: "22.22.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm --filter ced-app-fe format
        continue-on-error: false

      - name: Run ESLint check
        run: pnpm --filter ced-app-fe lint
        continue-on-error: false
