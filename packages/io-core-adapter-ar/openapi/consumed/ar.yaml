openapi: 3.0.1
info:
  title: External API service
  description: This service is the proxy for external services
  version: v2
servers:
  - url: https://api.uat.selfcare.pagopa.it/external/v2
paths:
  /delegations:
    get:
      tags:
        - Delegation
      summary: Retrieve institution's delegations
      description: Retrieve institution's delegations
      operationId: getDelegationsUsingGET
      parameters:
        - name: institutionId
          in: query
          description: The internal identifier of the institution
          schema:
            type: string
        - name: brokerId
          in: query
          description: The internal identifier of the institution
          schema:
            type: string
        - name: productId
          in: query
          description: Product's unique identifier
          schema:
            type: string
        - name: search
          in: query
          description: Description ente
          schema:
            type: string
        - name: taxCode
          in: query
          description: Institution's tax code
          schema:
            type: string
        - name: order
          in: query
          description: Order to show response NONE, ASC, DESC
          schema:
            enum:
              - NONE
              - ASC
              - DESC
            type: string
        - name: page
          in: query
          description: page
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          description: size
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DelegationResponse"
              example:
                - id: string
                  institutionId: string
                  institutionName: string
                  institutionRootName: string
                  type: PT
                  productId: string
                  taxCode: string
                  institutionType: string
                  brokerId: string
                  brokerTaxCode: string
                  brokerType: string
                  brokerName: string
                  status: ACTIVE
                  createdAt: string
                  updatedAt: string
                  isTest: true
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: string
                title: string
                status: 500
                detail: string
                instance: string
                invalidParams:
                  - name: string
                    reason: string
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: string
                title: string
                status: 500
                detail: string
                instance: string
                invalidParams:
                  - name: string
                    reason: string
  /delegations/delegates/{institutionId}:
    get:
      tags:
        - Delegation
      summary: Returns the delegates of an institution with the details of each
      description: >-
        Returns the list of institutions of all delegations created by the
        institution specified in the request path parameter.<br><br> Example:
        /delegations/delegates/A --> Returns institution details of
        B,C,D<br><br> <img
        src="https://img.plantuml.biz/plantuml/svg/SoWkIImgoStCIybDBE0goIzGACbNICelASdFLKZ9B4fDBidCp-FIKaWhoi-rKl3CAox9B2a5YIauScbf0HMZ2ZfX4tJ69kZ2vP0Aj1HgCG00">
      operationId: getDelegateInstitutionsUsingGET
      parameters:
        - name: institutionId
          in: path
          description: The internal identifier of the institution
          required: true
          schema:
            type: string
        - name: productId
          in: query
          description: Product's unique identifier
          schema:
            type: string
        - name: type
          in: query
          description: Delegation's type
          schema:
            enum:
              - PT
              - AOO
              - EA
            type: string
        - name: cursor
          in: query
          description: >-
            ID of the last returned element from where to continue to get
            another page of results
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          description: Page size
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DelegationInstitutionResponse"
              example:
                - id: 0
                  delegationId: string
                  delegationType: PT
                  delegationProductId: string
                  institution:
                    id: string
                    externalId: string
                    origin: string
                    originId: string
                    description: string
                    institutionType: string
                    digitalAddress: string
                    address: string
                    zipCode: string
                    taxCode: string
                    city: string
                    county: string
                    country: string
                    istatCode: string
                    geographicTaxonomies:
                      - code: string
                        desc: string
                    attributes:
                      - origin: string
                        code: string
                        description: string
                    onboarding:
                      - productId: string
                        tokenId: string
                        status: ACTIVE
                        billing:
                          vatNumber: string
                          taxCodeInvoicing: string
                          recipientCode: string
                          publicServices: true
                        createdAt: string
                        updatedAt: string
                        isAggregator: true
                        institutionType: PA
                        origin: string
                        originId: string
                    paymentServiceProvider:
                      abiCode: string
                      businessRegisterNumber: string
                      legalRegisterNumber: string
                      legalRegisterName: string
                      vatNumberGroup: true
                    dataProtectionOfficer:
                      address: string
                      email: string
                      pec: string
                    rootParent:
                      description: string
                      id: string
                    rea: string
                    shareCapital: string
                    businessRegisterPlace: string
                    supportEmail: string
                    supportPhone: string
                    imported: true
                    subunitCode: string
                    subunitType: string
                    aooParentCode: string
                    createdAt: string
                    updatedAt: string
                    delegation: true
                    logo: string
                    isTest: true
                    legalForm: string
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: string
                title: string
                status: 500
                detail: string
                instance: string
                invalidParams:
                  - name: string
                    reason: string
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: string
                title: string
                status: 500
                detail: string
                instance: string
                invalidParams:
                  - name: string
                    reason: string
