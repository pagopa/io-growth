        "403":
          description: Not Allowed
  /onboarding/{onboardingId}/complete:
    put:
      tags:
        - Onboarding Controller
      summary: >-
        Complete onboarding by verifying and uploading contract, then trigger
        async activities.
      description: >-
        Perform complete operation of an onboarding request receiving onboarding
        id and contract signed by the institution.It checks the contract's
        signature and upload the contract on an azure storageAt the end,
        function triggers async activities related to complete onboarding that
        consist of create the institution, activate the onboarding and sending
        data to notification queue.
      operationId: completeOnboardingUsingPUT
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - contract
              properties:
                contract:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
  /onboarding/{onboardingId}/reject:
    put:
      tags:
        - Onboarding Controller
      summary: Perform reject operation of an onboarding request
      description: >-
        Perform reject operation of an onboarding request receiving onboarding
        id.Function change status to REJECT for an onboarding request that is
        not COMPLETED.
      operationId: rejectOnboardingUsingPUT
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
