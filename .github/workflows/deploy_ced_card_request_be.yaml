name: Deploy CED Card Request BE to Azure Container App

permissions:
  contents: read
  attestations: write
  packages: write
  id-token: write

on:
  workflow_dispatch: {}

jobs:
  deploy_ced_card_request_be:
    uses: pagopa/dx/.github/workflows/release-azure-containerapp-v1.yaml@3448c24fd46deea4a4a8cc6a0902641c448d2fb3 # main
    name: Deploy CED Card Request BE
    secrets: inherit
    with:
      # The dockerfile_context and dockerfile_path are not specified because the defaults are './' and './Dockerfile' respectively.
      container_app: ced-p-itn-card-request-be-ca-01
      resource_group_name: ced-p-itn-rg-01
      environment: app-prod
      docker_image_description: "CED Card Request Backend - Backend service for the
        operator's CED card request to manage opportunities"
      docker_image_name: pagopa/ced-card-request-be
      build_args: "APP_NAME=ced-card-request-be"
