openapi: 3.0.3
info:
  title: CED Portal Backend
  version: 1.0.0
  description: >-
    Backend API for the CED Operator Portal. Operator referents access the
    portal through Area Riservata to create the operator profile and manage the
    public data, access points, benefits, and opportunities offered to
    European Disability Card holders.
servers:
  - url: https://ced-portal-be-ca/api
tags:
  - name: Auth
  - name: Profile
  - name: Places
paths:
  /operator/profile:
    get:
      tags:
        - Profile
      summary: Get the authenticated operator profile
      operationId: getOperatorProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorProfileResponse"
              examples:
                onlinePlace:
                  summary: Operator with online place
                  value:
                    displayName: Operatore Demo
                    place:
                      id: 01JVMK3N8XQZP5T6G2WYHAB4CD
                      type: online
                      name: Sportello remoto
                      website:
                        url: https://example.org
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CE
                          type: email
                          value: support@example.org
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CF
                          type: phone
                          value: "+39 0000000000"
                offlinePlace:
                  summary: Operator with offline place
                  value:
                    displayName: Operatore Demo
                    place:
                      id: 01JVMK3N8XQZP5T6G2WYHAB4CG
                      type: offline
                      name: Sportello centrale
                      address:
                        street: Via Roma 1
                        city: Roma
                        state: RM
                        postalCode: "00100"
                        country: IT
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CH
                          type: website
                          value: https://example.org/support
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: No data associated with the authenticated operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Operator profile not found
    post:
      tags:
        - Profile
      summary: Create the authenticated operator profile
      operationId: createOperatorProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorProfileCreateRequest"
            examples:
              onlinePlace:
                summary: Creating an online place
                value:
                  displayName: Operatore Demo
                  place:
                    type: online
                    name: Sportello remoto
                    website:
                      url: https://example.org
                    supportContacts:
                      - type: email
                        value: support@example.org
              offlinePlace:
                summary: Creating an offline place
                value:
                  displayName: Operatore Demo
                  place:
                    type: offline
                    name: Sportello centrale
                    address:
                      street: Via Roma 1
                      city: Roma
                      state: RM
                      postalCode: "00100"
                      country: IT
                    supportContacts:
                      - type: website
                        value: https://example.org/support
      responses:
        "201":
          description: Operator profile created successfully
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /operator/places:
    get:
      tags:
        - Places
      summary: List places for the authenticated operator
      operationId: listOperatorPlaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operator places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaceResponse"
              examples:
                mixedPlaces:
                  summary: Online and offline places
                  value:
                    - id: 01JVMK3N8XQZP5T6G2WYHAB4CD
                      type: online
                      name: Sportello remoto
                      website:
                        url: https://example.org
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CE
                          type: email
                          value: support@example.org
                    - id: 01JVMK3N8XQZP5T6G2WYHAB4CG
                      type: offline
                      name: Sportello centrale
                      address:
                        street: Via Roma 1
                        city: Roma
                        state: RM
                        postalCode: "00100"
                        country: IT
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CF
                          type: phone
                          value: "+39 0000000000"
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
    post:
      tags:
        - Places
      summary: Create a place for the authenticated operator
      operationId: createOperatorPlace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceCreateRequest"
            examples:
              onlinePlace:
                summary: Creating an online place
                value:
                  type: online
                  name: Sportello remoto
                  website:
                    url: https://example.org
                  supportContacts:
                    - type: email
                      value: support@example.org
              offlinePlace:
                summary: Creating an offline place
                value:
                  type: offline
                  name: Sportello centrale
                  address:
                    street: Via Roma 1
                    city: Roma
                    state: RM
                    postalCode: "00100"
                    country: IT
                  supportContacts:
                    - type: website
                      value: https://example.org/support
      responses:
        "201":
          description: Place created successfully
        "400":
          description: Invalid place payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Validation error
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /operator/places/{placeId}:
    get:
      tags:
        - Places
      summary: Get a place for the authenticated operator
      operationId: getOperatorPlace
      security:
        - bearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      responses:
        "200":
          description: Operator place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
              examples:
                onlinePlace:
                  summary: Online place
                  value:
                    id: 01JVMK3N8XQZP5T6G2WYHAB4CD
                    type: online
                    name: Sportello remoto
                    website:
                      url: https://example.org
                    supportContacts:
                      - id: 01JVMK3N8XQZP5T6G2WYHAB4CE
                        type: email
                        value: support@example.org
                offlinePlace:
                  summary: Offline place
                  value:
                    id: 01JVMK3N8XQZP5T6G2WYHAB4CG
                    type: offline
                    name: Sportello centrale
                    address:
                      street: Via Roma 1
                      city: Roma
                      state: RM
                      postalCode: "00100"
                      country: IT
                    supportContacts:
                      - id: 01JVMK3N8XQZP5T6G2WYHAB4CH
                        type: website
                        value: https://example.org/support
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Place not found
  /acs:
    get:
      tags:
        - Auth
      summary: Assertion Consumer Service callback
      description: >-
        Receives an authentication token from the identity provider,
        validates it, creates a session, and redirects to the authorize
        endpoint with a one-time session ID.
      operationId: acs
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "302":
          description: Redirect to the authorize endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: "/api/authorize?id={sessionId}"
        "400":
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Validation error
  /authorize:
    get:
      tags:
        - Auth
      summary: Exchange a one-time session ID for session details
      description: >-
        Consumes the one-time session ID produced by the ACS endpoint
        and returns the session token together with operator details.
      operationId: authorize
      security: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Session not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OperatorProfileCreateRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - place
      properties:
        displayName:
          type: string
        place:
          $ref: "#/components/schemas/PlaceCreateRequest"
    PlaceBase:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - supportContacts
      properties:
        type:
          type: string
          enum:
            - online
            - offline
        name:
          type: string
        supportContacts:
          type: array
          items:
            $ref: "#/components/schemas/SupportContactCreateRequest"
    PlaceCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/OnlinePlaceCreateRequest"
        - $ref: "#/components/schemas/OfflinePlaceCreateRequest"
      discriminator:
        propertyName: type
        mapping:
          online: "#/components/schemas/OnlinePlaceCreateRequest"
          offline: "#/components/schemas/OfflinePlaceCreateRequest"
    OfflinePlaceCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PlaceBase"
        - type: object
          additionalProperties: false
          required:
            - address
          properties:
            address:
              $ref: "#/components/schemas/Address"
    OnlinePlaceCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PlaceBase"
        - type: object
          additionalProperties: false
          required:
            - website
          properties:
            website:
              $ref: "#/components/schemas/Website"
    PlaceResponseBase:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
        - supportContacts
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        type:
          type: string
          enum:
            - online
            - offline
        name:
          type: string
        supportContacts:
          type: array
          items:
            $ref: "#/components/schemas/SupportContactResponse"
    OfflinePlaceResponse:
      allOf:
        - $ref: "#/components/schemas/PlaceResponseBase"
        - type: object
          additionalProperties: false
          required:
            - address
          properties:
            address:
              $ref: "#/components/schemas/Address"
    OnlinePlaceResponse:
      allOf:
        - $ref: "#/components/schemas/PlaceResponseBase"
        - type: object
          additionalProperties: false
          required:
            - website
          properties:
            website:
              $ref: "#/components/schemas/Website"
    PlaceResponse:
      oneOf:
        - $ref: "#/components/schemas/OnlinePlaceResponse"
        - $ref: "#/components/schemas/OfflinePlaceResponse"
      discriminator:
        propertyName: type
        mapping:
          online: "#/components/schemas/OnlinePlaceResponse"
          offline: "#/components/schemas/OfflinePlaceResponse"
    OperatorProfileResponse:
      type: object
      additionalProperties: false
      required:
        - displayName
        - place
      properties:
        displayName:
          type: string
        place:
          $ref: "#/components/schemas/PlaceResponse"
    Address:
      type: object
      additionalProperties: false
      required:
        - street
        - city
        - state
        - postalCode
        - country
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
    SupportContactCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - email
            - phone
            - website
        value:
          type: string
    SupportContactResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - value
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        type:
          type: string
          enum:
            - email
            - phone
            - website
        value:
          type: string
    Website:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
        message:
          type: string
    AuthorizeResponse:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - operator_name
        - session_token
      properties:
        first_name:
          type: string
        last_name:
          type: string
        operator_name:
          type: string
        session_token:
          type: string
