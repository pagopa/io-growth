openapi: 3.0.3
info:
  title: CED Portal Backend
  version: 1.0.0
  description: >-
    Backend API for the CED Operator Portal. Operator referents access the
    portal through Area Riservata to create the operator profile and manage the
    public data, access points, benefits, and opportunities offered to
    European Disability Card holders.
servers:
  - url: https://ced-portal-be-ca/api
tags:
  - name: Auth
  - name: Profile
  - name: Places
  - name: Opportunities
  - name: Categories
  - name: Department
paths:
  /operator/profile:
    get:
      tags:
        - Profile
      summary: Get the authenticated operator profile
      operationId: getOperatorProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorProfileResponse"
              examples:
                onlinePlace:
                  summary: Operator with online place
                  value:
                    displayName: Operatore Demo
                    place:
                      id: 01JVMK3N8XQZP5T6G2WYHAB4CD
                      type: online
                      name: Sportello remoto
                      website:
                        url: https://example.org
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CE
                          type: email
                          value: support@example.org
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CF
                          type: phone
                          value: "+39 0000000000"
                offlinePlace:
                  summary: Operator with offline place
                  value:
                    displayName: Operatore Demo
                    place:
                      id: 01JVMK3N8XQZP5T6G2WYHAB4CG
                      type: offline
                      name: Sportello centrale
                      address:
                        street: Via Roma 1
                        city: Roma
                        state: RM
                        postalCode: "00100"
                        country: IT
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CH
                          type: website
                          value: https://example.org/support
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: No data associated with the authenticated operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Operator profile not found
    post:
      tags:
        - Profile
      summary: Create the authenticated operator profile
      operationId: createOperatorProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorProfileCreateRequest"
            examples:
              onlinePlace:
                summary: Creating an online place
                value:
                  displayName: Operatore Demo
                  place:
                    type: online
                    name: Sportello remoto
                    website:
                      url: https://example.org
                    supportContacts:
                      - type: email
                        value: support@example.org
              offlinePlace:
                summary: Creating an offline place
                value:
                  displayName: Operatore Demo
                  place:
                    type: offline
                    name: Sportello centrale
                    address:
                      street: Via Roma 1
                      city: Roma
                      state: RM
                      postalCode: "00100"
                      country: IT
                    supportContacts:
                      - type: website
                        value: https://example.org/support
      responses:
        "201":
          description: Operator profile created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorProfileResponse"
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /operator/places:
    get:
      tags:
        - Places
      summary: List places for the authenticated operator
      operationId: listOperatorPlaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operator places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaceResponse"
              examples:
                mixedPlaces:
                  summary: Online and offline places
                  value:
                    - id: 01JVMK3N8XQZP5T6G2WYHAB4CD
                      type: online
                      name: Sportello remoto
                      website:
                        url: https://example.org
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CE
                          type: email
                          value: support@example.org
                    - id: 01JVMK3N8XQZP5T6G2WYHAB4CG
                      type: offline
                      name: Sportello centrale
                      address:
                        street: Via Roma 1
                        city: Roma
                        state: RM
                        postalCode: "00100"
                        country: IT
                      supportContacts:
                        - id: 01JVMK3N8XQZP5T6G2WYHAB4CF
                          type: phone
                          value: "+39 0000000000"
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
    post:
      tags:
        - Places
      summary: Create a place for the authenticated operator
      operationId: createOperatorPlace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceCreateRequest"
            examples:
              onlinePlace:
                summary: Creating an online place
                value:
                  type: online
                  name: Sportello remoto
                  website:
                    url: https://example.org
                  supportContacts:
                    - type: email
                      value: support@example.org
              offlinePlace:
                summary: Creating an offline place
                value:
                  type: offline
                  name: Sportello centrale
                  address:
                    street: Via Roma 1
                    city: Roma
                    state: RM
                    postalCode: "00100"
                    country: IT
                  supportContacts:
                    - type: website
                      value: https://example.org/support
      responses:
        "201":
          description: Place created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
        "400":
          description: Invalid place payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Validation error
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /operator/places/{placeId}:
    get:
      tags:
        - Places
      summary: Get a place for the authenticated operator
      operationId: getOperatorPlace
      security:
        - bearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      responses:
        "200":
          description: Operator place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
              examples:
                onlinePlace:
                  summary: Online place
                  value:
                    id: 01JVMK3N8XQZP5T6G2WYHAB4CD
                    type: online
                    name: Sportello remoto
                    website:
                      url: https://example.org
                    supportContacts:
                      - id: 01JVMK3N8XQZP5T6G2WYHAB4CE
                        type: email
                        value: support@example.org
                offlinePlace:
                  summary: Offline place
                  value:
                    id: 01JVMK3N8XQZP5T6G2WYHAB4CG
                    type: offline
                    name: Sportello centrale
                    address:
                      street: Via Roma 1
                      city: Roma
                      state: RM
                      postalCode: "00100"
                      country: IT
                    supportContacts:
                      - id: 01JVMK3N8XQZP5T6G2WYHAB4CH
                        type: website
                        value: https://example.org/support
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Place not found
  /operator/opportunities/{opportunityId}:
    get:
      tags:
        - Opportunities
      summary: Get a single opportunity for the authenticated operator
      operationId: getOperatorOpportunity
      security:
        - bearerAuth: []
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetailResponse"
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Opportunity not found
  /operator/opportunities/{opportunityId}/request-test:
    patch:
      tags:
        - Opportunities
      summary: Request testing for a draft opportunity
      operationId: operatorRequestOpportunityTest
      security:
        - bearerAuth: []
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      responses:
        "204":
          description: Testing requested successfully
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Opportunity not found
        "409":
          description: Opportunity status was modified concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 409
                message: Opportunity status was modified concurrently
        "412":
          description: Opportunity is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 412
                message: Opportunity is not in draft status
  /operator/opportunities:
    get:
      tags:
        - Opportunities
      summary: List opportunities for the authenticated operator
      operationId: listOperatorOpportunities
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - test_pending
              - test_rejected
              - test_passed
              - published
              - suspended
              - deleted
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Paginated list of operator opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityListResponse"
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
    post:
      tags:
        - Opportunities
      summary: Create an opportunity for the authenticated operator
      operationId: createOperatorOpportunity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityCreateRequest"
            examples:
              discountBenefit:
                summary: Opportunity with discount benefit
                value:
                  dateFrom: "2026-01-01"
                  dateTo: "2026-12-31"
                  url: https://example.org/promo
                  categoryId: 01KRJXEYD44B58700GT982CCYY
                  placeIds:
                    - 01JVMK3N8XQZP5T6G2WYHAB4CD
                  beneficiaryBenefit:
                    type: discount
                    discountType: percentage
                    value: 20
                  caregiverBenefit:
                    type: free
                  localizedMetadata:
                    - key: name
                      language: it
                      value: Sconto 20%
                    - key: description
                      language: it
                      value: Sconto del 20% su tutti i servizi
      responses:
        "201":
          description: Opportunity created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetailResponse"
        "400":
          description: Invalid opportunity payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Validation error
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /opportunity-categories:
    get:
      tags:
        - Categories
      summary: List all opportunity categories
      operationId: listOpportunityCategories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of opportunity categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpportunityCategoryItem"
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /acs:
    get:
      tags:
        - Auth
      summary: Assertion Consumer Service callback
      description: >-
        Receives an authentication token from the identity provider,
        validates it, creates a session, and redirects to the authorize
        endpoint with a one-time session ID.
      operationId: acs
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "302":
          description: Redirect to the authorize endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: "/api/authorize?id={sessionId}"
        "400":
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Validation error
  /authorize:
    get:
      tags:
        - Auth
      summary: Exchange a one-time session ID for session details
      description: >-
        Consumes the one-time session ID produced by the ACS endpoint
        and returns the session token together with operator details.
      operationId: authorize
      security: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Session not found
  /department/onboardings:
    get:
      tags:
        - Department
      summary: List onboarding requests
      description: >-
        Returns a paginated list of onboarding requests for the configured
        product. Non-PENDING_IN_REVIEW items are enriched with an opportunity
        count from the local database.
      operationId: listOnboardings
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - REQUEST
              - TOBEVALIDATED
              - PENDING
              - PENDING_IN_REVIEW
              - COMPLETED
              - FAILED
              - REJECTED
              - DELETED
        - name: name
          in: query
          required: false
          description: Filter onboardings by institution name.
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of pending onboarding requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingOnboardingsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
  /department/onboardings/{onboardingId}:
    get:
      tags:
        - Department
      summary: Get an onboarding by ID
      description: >-
        Retrieves a single onboarding request by its ID from Area Riservata.
        Returns 404 if the onboarding is not found.
      operationId: getOnboarding
      security:
        - bearerAuth: []
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Not Found
  /department/onboardings/{onboardingId}/complete:
    put:
      tags:
        - Department
      summary: Complete an onboarding request
      description: >-
        Uploads the signed contract for the given onboarding and triggers the
        completion workflow on Area Riservata.
      operationId: completeOnboarding
      security:
        - bearerAuth: []
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - contract
              properties:
                contract:
                  type: string
                  format: binary
      responses:
        "200":
          description: Onboarding completed successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 403
                message: Forbidden
  /department/onboardings/{onboardingId}/contract:
    get:
      tags:
        - Department
      summary: Download the signed contract for an onboarding
      description: >-
        Downloads the signed contract file associated with the specified
        onboarding from Area Riservata.
      operationId: getContractSigned
      security:
        - bearerAuth: []
      parameters:
        - name: onboardingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signed contract file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 403
                message: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OperatorProfileCreateRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - place
      properties:
        displayName:
          type: string
        place:
          $ref: "#/components/schemas/PlaceCreateRequest"
    PlaceBase:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - supportContacts
      properties:
        type:
          type: string
          enum:
            - online
            - offline
        name:
          type: string
        supportContacts:
          type: array
          items:
            $ref: "#/components/schemas/SupportContactCreateRequest"
    PlaceCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/OnlinePlaceCreateRequest"
        - $ref: "#/components/schemas/OfflinePlaceCreateRequest"
      discriminator:
        propertyName: type
        mapping:
          online: "#/components/schemas/OnlinePlaceCreateRequest"
          offline: "#/components/schemas/OfflinePlaceCreateRequest"
    OfflinePlaceCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PlaceBase"
        - type: object
          additionalProperties: false
          required:
            - address
          properties:
            address:
              $ref: "#/components/schemas/Address"
    OnlinePlaceCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PlaceBase"
        - type: object
          additionalProperties: false
          required:
            - website
          properties:
            website:
              $ref: "#/components/schemas/Website"
    PlaceResponseBase:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
        - supportContacts
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        type:
          type: string
          enum:
            - online
            - offline
        name:
          type: string
        supportContacts:
          type: array
          items:
            $ref: "#/components/schemas/SupportContactResponse"
    OfflinePlaceResponse:
      allOf:
        - $ref: "#/components/schemas/PlaceResponseBase"
        - type: object
          additionalProperties: false
          required:
            - address
          properties:
            address:
              $ref: "#/components/schemas/Address"
    OnlinePlaceResponse:
      allOf:
        - $ref: "#/components/schemas/PlaceResponseBase"
        - type: object
          additionalProperties: false
          required:
            - website
          properties:
            website:
              $ref: "#/components/schemas/Website"
    PlaceResponse:
      oneOf:
        - $ref: "#/components/schemas/OnlinePlaceResponse"
        - $ref: "#/components/schemas/OfflinePlaceResponse"
      discriminator:
        propertyName: type
        mapping:
          online: "#/components/schemas/OnlinePlaceResponse"
          offline: "#/components/schemas/OfflinePlaceResponse"
    OperatorProfileResponse:
      type: object
      additionalProperties: false
      required:
        - displayName
        - place
      properties:
        displayName:
          type: string
        place:
          $ref: "#/components/schemas/PlaceResponse"
    Address:
      type: object
      additionalProperties: false
      required:
        - street
        - city
        - state
        - postalCode
        - country
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
    SupportContactCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - email
            - phone
            - website
        value:
          type: string
    SupportContactResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - value
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        type:
          type: string
          enum:
            - email
            - phone
            - website
        value:
          type: string
    Website:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    OpportunityCreateRequest:
      type: object
      additionalProperties: false
      required:
        - dateFrom
        - placeIds
        - beneficiaryBenefit
        - localizedMetadata
        - categoryId
      properties:
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        url:
          type: string
          format: uri
        categoryId:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        nationalTerritory:
          type: boolean
          default: false
        placeIds:
          type: array
          minItems: 0
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        beneficiaryBenefit:
          $ref: "#/components/schemas/BenefitRequest"
        caregiverBenefit:
          $ref: "#/components/schemas/BenefitRequest"
        localizedMetadata:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LocalizedMetadataItem"
    BenefitRequest:
      oneOf:
        - $ref: "#/components/schemas/BenefitFree"
        - $ref: "#/components/schemas/BenefitPriority"
        - $ref: "#/components/schemas/BenefitReducedFixedPrice"
        - $ref: "#/components/schemas/BenefitDiscount"
        - $ref: "#/components/schemas/BenefitOther"
      discriminator:
        propertyName: type
        mapping:
          free: "#/components/schemas/BenefitFree"
          priority: "#/components/schemas/BenefitPriority"
          reduced_fixed_price: "#/components/schemas/BenefitReducedFixedPrice"
          discount: "#/components/schemas/BenefitDiscount"
          other: "#/components/schemas/BenefitOther"
    BenefitFree:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - free
    BenefitPriority:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - priority
    BenefitReducedFixedPrice:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - reduced_fixed_price
        value:
          type: integer
    BenefitDiscount:
      type: object
      additionalProperties: false
      required:
        - type
        - discountType
        - value
      properties:
        type:
          type: string
          enum:
            - discount
        discountType:
          type: string
          enum:
            - percentage
            - fixed_amount
        value:
          type: integer
    BenefitOther:
      type: object
      additionalProperties: false
      required:
        - type
        - description
      properties:
        type:
          type: string
          enum:
            - other
        description:
          type: string
    LocalizedMetadataItem:
      type: object
      additionalProperties: false
      required:
        - key
        - language
        - value
      properties:
        key:
          type: string
          enum:
            - name
            - description
            - condition
        language:
          type: string
          enum:
            - en
            - fr
            - de
            - sl
            - it
        value:
          type: string
    OpportunityListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OpportunitySummaryItem"
        total:
          type: integer
          minimum: 0
    OpportunitySummaryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - name
        - categoryTitle
        - dateFrom
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        status:
          type: string
          enum:
            - draft
            - test_pending
            - test_rejected
            - test_passed
            - published
            - suspended
            - deleted
        name:
          type: string
        categoryTitle:
          type: string
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
          nullable: true
    OpportunityDetailResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - dateFrom
        - categoryId
        - categoryTitle
        - nationalTerritory
        - beneficiaryBenefit
        - localizedMetadata
        - placeIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        status:
          type: string
          enum:
            - draft
            - test_pending
            - test_rejected
            - test_passed
            - published
            - suspended
            - deleted
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        nationalTerritory:
          type: boolean
        categoryId:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        categoryTitle:
          type: string
        beneficiaryBenefit:
          $ref: "#/components/schemas/BenefitRequest"
        caregiverBenefit:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BenefitRequest"
        localizedMetadata:
          type: array
          items:
            $ref: "#/components/schemas/LocalizedMetadataItem"
        placeIds:
          type: array
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
        message:
          type: string
    OpportunityCategoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        title:
          type: string
        description:
          type: string
    AuthorizeResponse:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - operator_name
        - session_token
      properties:
        first_name:
          type: string
        last_name:
          type: string
        operator_name:
          type: string
        session_token:
          type: string
    PendingOnboardingsResponse:
      type: object
      required:
        - items
        - count
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingItem"
        count:
          type: integer
          minimum: 0
    OnboardingItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        workflowType:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        opportunityCount:
          type: integer
          minimum: 0
          description: >-
            Number of opportunities for this operator. Present only for
            non-PENDING_IN_REVIEW onboardings.
        institution:
          type: object
          properties:
            id:
              type: string
            description:
              type: string
            taxCode:
              type: string
            digitalAddress:
              type: string
            city:
              type: string
            county:
              type: string
