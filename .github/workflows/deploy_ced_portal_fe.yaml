name: Deploy CED Portal FE to Azure Static Web App

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "apps/ced-portal-fe/**"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - closed
        branches:
            - main
        paths:
            - "apps/ced-portal-fe/**"

jobs:
    deploy_ced_portal_fe:
        # packages: read is required by the GitHub Packages authentication that
        # release-azure-staticapp-v1 runs before building (pagopa/dx#2390).
        permissions:
            contents: read
            id-token: write
            packages: read
            pull-requests: write
        uses: pagopa/dx/.github/workflows/release-azure-staticapp-v1.yaml@abb37e552370c4b3e2e5b2601c76a307f421c074 # main
        name: Deploy CED Portal FE
        secrets: inherit
        with:
            workspace_name: ced-portal-fe
            output_dir: dist
            static_web_app_name: ced-p-weu-portal-fe-stapp-01
            resource_group_name: ced-p-itn-rg-01
            environment: app-prod
            use_private_agent: true
            use_labels: false
